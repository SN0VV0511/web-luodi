<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>技术手稿馆 · 楼层后台</title>
<style>
  /* Flat dark admin — same navy/gold tokens as sn0vv.top (app/styles/tokens.css), system fonts only. */
  :root {
    --bg:#0e1824; --surface:#132131; --surface-2:#182a3d; --line:#25384d; --line-strong:#36506b;
    --fg:#f4f7fb; --muted:#a6b8ca; --subtle:#8fa3b8;
    --gold:#f0c372; --on-gold:#0e1b2a; --accent:#72c2e8; --ok:#74d3a3; --danger:#ff8a7a; --danger-bg:#2a1a1d;
    --focus:#f0c372; --radius:10px; --tap:44px; --dur:150ms;
    --body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:15px/1.6 var(--body); background:var(--bg); color:var(--fg); min-height:100vh; }
  h1, h2 { text-wrap:balance; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
  .skip { position:absolute; left:12px; top:-60px; background:var(--gold); color:var(--on-gold); padding:10px 14px; border-radius:8px; font-weight:700; z-index:10; }
  .skip:focus { top:12px; }

  header.top { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--surface); }
  .badge { font:800 14px var(--mono); background:var(--gold); color:var(--on-gold); padding:6px 10px; border-radius:6px; }
  header.top h1 { font-size:18px; line-height:1.3; margin:0; flex:1; min-width:0; }
  header.top h1 small { display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:2px; }

  button, .btn { font:inherit; font-size:14px; min-height:36px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--fg);
    padding:6px 14px; border-radius:8px; cursor:pointer; text-decoration:none; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:border-color var(--dur), background-color var(--dur); }
  button:hover, .btn:hover { border-color:var(--accent); }
  button.primary { background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700; min-height:var(--tap); padding:8px 20px; }
  button.primary:hover { background:#f5d08f; }
  button.danger { color:var(--danger); }
  button.danger:hover { border-color:var(--danger); }
  button.danger.solid { background:var(--danger); color:#1b0d0d; border-color:var(--danger); font-weight:700; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.45; cursor:not-allowed; }

  main { max-width:1080px; margin:0 auto; padding:28px 22px 64px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px; }
  .card h2 { margin:0 0 6px; font-size:17px; display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .card > p.hint { margin:0 0 16px; color:var(--muted); font-size:13px; }

  label { display:block; color:var(--muted); font-size:13px; margin:0 0 6px; }
  input[type=text], input[type=password] { font:inherit; width:100%; min-height:var(--tap); padding:10px 12px; border-radius:8px;
    border:1px solid var(--line-strong); background:var(--bg); color:var(--fg); }
  input:focus-visible { outline:2px solid var(--focus); outline-offset:1px; border-color:transparent; }
  input[aria-invalid=true] { border-color:var(--danger); }
  input:disabled { opacity:.5; }
  .field-err { color:var(--danger); font-size:13px; margin:6px 0 0; min-height:0; }
  .field-err:empty { display:none; }

  .login { max-width:400px; margin:12vh auto 0; }
  .login form { display:grid; gap:14px; margin-top:12px; }

  .banner { display:flex; gap:10px; align-items:flex-start; border-radius:8px; padding:10px 12px; font-size:14px; margin-top:14px; border:1px solid var(--line); }
  .banner:empty { display:none; }
  .banner.ok { border-color:#2f5f49; background:#14271f; color:var(--ok); }
  .banner.err { border-color:#6b3434; background:var(--danger-bg); color:var(--danger); }

  .drop { width:100%; min-height:132px; border:2px dashed var(--line-strong); border-radius:var(--radius); padding:24px; display:grid; place-content:center; gap:6px;
    text-align:center; color:var(--muted); background:var(--bg); cursor:pointer; font-size:14px; transition:border-color var(--dur), background-color var(--dur); }
  .drop strong { color:var(--fg); font-size:16px; }
  .drop:hover, .drop.over { border-color:var(--gold); background:#16202c; color:var(--fg); }
  .drop.over { border-style:solid; }

  .row { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; margin-top:16px; }
  .queue { list-style:none; margin:14px 0 0; padding:0; display:grid; gap:8px; }
  .queue:empty { display:none; }
  .qitem { display:grid; grid-template-columns:minmax(0,1fr) 180px 56px auto; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font-size:14px; }
  .qitem .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qitem .name small { color:var(--subtle); margin-left:6px; font-size:12px; }
  .qitem .pct { font:600 13px var(--mono); color:var(--muted); text-align:right; }
  .qitem .err { grid-column:1 / -1; color:var(--danger); font-size:13px; }
  .qitem .err:empty { display:none; }
  .qitem.is-rejected .bar { visibility:hidden; }
  .qitem.is-done { border-color:#2f5f49; } .qitem.is-done .pct { color:var(--ok); }
  .qitem.is-error { border-color:#6b3434; background:var(--danger-bg); }
  .bar { height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--gold); transition:width var(--dur) linear; }
  .qitem.is-done .bar > i { background:var(--ok); } .qitem.is-error .bar > i { background:var(--danger); }

  .count { color:var(--muted); font-weight:400; font-size:13px; }
  .floors { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  .floor { display:grid; grid-template-columns:56px minmax(0,1fr) 88px 140px 290px; gap:14px; align-items:center; padding:12px 6px; border-bottom:1px solid var(--line); }
  .floor .code { font:800 15px var(--mono); color:var(--gold); }
  .floor.builtin .code { color:var(--accent); }
  .floor .title strong { font-weight:600; overflow-wrap:anywhere; }
  .floor .file { color:var(--subtle); font-size:12px; overflow-wrap:anywhere; }
  .floor .meta { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .floor .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; }
  .floor .row-err { grid-column:2 / -1; color:var(--danger); font-size:13px; }
  .floor .row-err:empty { display:none; }
  .floor .confirm { color:var(--danger); font-size:13px; align-self:center; text-align:right; }
  .floor form.edit { display:flex; gap:6px; align-items:center; }
  .floor form.edit input { min-height:36px; padding:6px 10px; flex:1; min-width:0; }
  .floor form.edit button { flex-shrink:0; min-height:36px; padding:6px 12px; }
  .tag { display:inline-block; font-size:12px; line-height:1.5; padding:0 8px; margin-left:8px; border-radius:99px; border:1px solid var(--accent); color:var(--accent); vertical-align:1px; }
  .locked { color:var(--subtle); font-size:13px; padding:0 4px; align-self:center; }
  .empty { color:var(--muted); text-align:center; padding:28px; }
  .col-head { display:grid; grid-template-columns:56px minmax(0,1fr) 88px 140px 290px; gap:14px; padding:0 6px 8px; color:var(--subtle); font-size:12px; }

  dialog { width:min(1100px,94vw); height:86vh; border:1px solid var(--line-strong); border-radius:var(--radius); padding:0; background:var(--surface); color:var(--fg); }
  dialog::backdrop { background:rgba(4,8,14,.72); }
  dialog .dhead { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  dialog .dhead strong { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  dialog iframe { width:100%; height:calc(86vh - 60px); border:0; background:#fff; }

  @media (max-width:760px) {
    header.top { padding:12px 14px; gap:10px; }
    header.top h1 { font-size:16px; }
    header.top h1 small { display:none; }
    button, .btn { min-height:var(--tap); }
    main { padding:18px 14px 48px; }
    .card { padding:16px; }
    .row { grid-template-columns:1fr; }
    .qitem { grid-template-columns:minmax(0,1fr) 52px auto; }
    .qitem .bar { grid-column:1 / -1; grid-row:2; }
    .col-head { display:none; }
    .floor { grid-template-columns:52px minmax(0,1fr); gap:6px 12px; padding:14px 2px; }
    .floor .meta { grid-column:2; }
    .floor .meta.time { display:none; }
    .floor .actions { grid-column:1 / -1; justify-content:flex-start; }
    .floor .row-err { grid-column:1 / -1; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到主要内容</a>
<header class="top">
  <span class="badge" aria-hidden="true">08</span>
  <h1><span data-i18n="title">技术手稿馆 · 楼层后台</span><small data-i18n="subtitle">上传的 HTML 页面会自动变成 3D 大楼的新楼层</small></h1>
  <button id="lang" type="button" class="ghost" lang="en" aria-label="Switch to English">EN</button>
  <button id="logout" type="button" hidden data-i18n="logout">退出登录</button>
</header>

<main id="main" tabindex="-1">
  <section class="card login" id="loginCard" hidden aria-labelledby="loginTitle">
    <h2 id="loginTitle" data-i18n="loginTitle">管理员登录</h2>
    <form id="loginForm" autocomplete="on" novalidate>
      <div>
        <label for="pw" data-i18n="password">密码</label>
        <input id="pw" type="password" name="password" autocomplete="current-password" required aria-describedby="pwErr">
        <p class="field-err" id="pwErr" role="alert"></p>
      </div>
      <button class="primary" id="loginBtn" type="submit" data-i18n="login">登录</button>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card" aria-labelledby="upTitle">
      <h2 id="upTitle" data-i18n="uploadTitle">上传新楼层</h2>
      <p class="hint" data-i18n="dropHint">支持 .html / .htm，单个不超过 5MB，可一次选多个；每个文件一层楼。</p>
      <button class="drop" id="drop" type="button" aria-describedby="upTitle">
        <strong data-i18n="dropHere">拖拽 HTML 文件到这里，或点击选择</strong>
        <span data-i18n="dropSub">松开鼠标即加入待上传列表</span>
      </button>
      <input id="file" type="file" accept=".html,.htm,text/html" multiple hidden>
      <ul class="queue" id="queue" aria-label="待上传文件"></ul>
      <div class="row">
        <div>
          <label for="titleInput" data-i18n="titleLabel">楼层标题（可选，仅单个文件时生效；留空则用页面 &lt;title&gt;）</label>
          <input id="titleInput" type="text" maxlength="80">
        </div>
        <button class="primary" id="uploadBtn" type="button" disabled data-i18n="upload">上传</button>
      </div>
      <div class="banner" id="uploadMsg" role="status" aria-live="polite"></div>
    </section>

    <section class="card" aria-labelledby="listTitle">
      <h2 id="listTitle"><span data-i18n="listTitle">全部楼层</span> <span class="count" id="count"></span></h2>
      <p class="hint" data-i18n="listHint">1F、2F 是网站代码里自带的两层（Biglink、LoRA），可以预览和打开，但不能在后台删除或改名；在这里上传的页面会从 3F 往上一层层接。</p>
      <div class="col-head" aria-hidden="true"><span data-i18n="colFloor">楼层</span><span data-i18n="colTitle">标题 / 文件</span><span data-i18n="colSize">大小</span><span data-i18n="colTime">上传时间</span><span></span></div>
      <ul class="floors" id="rows"></ul>
      <div class="banner" id="listMsg" role="status" aria-live="polite"></div>
    </section>
  </div>
</main>

<dialog id="preview" aria-labelledby="previewTitle">
  <div class="dhead"><strong id="previewTitle"></strong>
    <a class="btn" id="previewOpen" target="_blank" rel="noopener noreferrer" data-i18n="openTab">新标签页打开</a>
    <button type="button" id="previewClose" data-i18n="close">关闭</button></div>
  <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-popups allow-modals" referrerpolicy="no-referrer" title="预览"></iframe>
</dialog>

<script>
(() => {
  const API = "/tower-admin/api";
  const BUILTIN_FLOORS = 2;
  const MAX = 5 * 1024 * 1024;
  const EN = {
    skip: "Skip to content", title: "Archive Tower · Floor Admin", subtitle: "Every uploaded HTML page becomes a new floor of the 3D tower",
    logout: "Log out", loginTitle: "Admin login", password: "Password", login: "Log in",
    uploadTitle: "Upload new floors", dropHere: "Drop HTML files here, or click to choose", dropSub: "Dropped files join the upload queue",
    dropHint: ".html / .htm, up to 5 MB each, multiple allowed — one floor per file.",
    titleLabel: "Floor title (optional, single file only; blank = page <title>)", upload: "Upload",
    listTitle: "All floors", listHint: "1F and 2F (Biglink, LoRA) ship with the site code — you can preview and open them, but not delete or rename them here. Uploads stack from 3F up.",
    colFloor: "Floor", colTitle: "Title / file", colSize: "Size", colTime: "Uploaded", openTab: "Open in new tab", close: "Close",
  };
  const T = {
    zh: { builtin: "内置", builtinTip: "这一层是网站代码自带的页面，随网站部署更新，不能在后台删除或改名", locked: "网站自带",
      empty: "还没有上传的楼层，选个 HTML 文件上传就会出现 3F", preview: "预览", open: "打开", rename: "改名", del: "删除",
      confirmDel: "删除后这层楼会消失", confirmYes: "确认删除", cancel: "取消", save: "保存", titleEmpty: "标题不能为空",
      uploaded: (n) => `已上传 ${n} 个页面，大楼长高了 ${n} 层`, someFailed: (n) => `${n} 个文件上传失败，原因见上方列表`,
      wrongType: "不是 .html / .htm 文件，已跳过", tooBig: "超过 5MB，已跳过", emptyFile: "文件是空的，已跳过", remove: "移除",
      count: (b, m) => `共 ${b + m} 层：内置 ${b} + 上传 ${m}`, waiting: "等待", net: "网络错误，请重试", pwEmpty: "请输入密码",
      checking: "登录中…", deleted: (t) => `已删除「${t}」`, renamed: "已改名", sessionGone: "登录已过期，请重新登录", newTitle: "新标题", langBtn: "EN", langLabel: "Switch to English" },
    en: { builtin: "Built-in", builtinTip: "This floor ships with the site code and updates with site deploys; it can't be deleted or renamed here", locked: "Site code",
      empty: "No uploaded floors yet — upload an HTML file to add 3F", preview: "Preview", open: "Open", rename: "Rename", del: "Delete",
      confirmDel: "This floor will disappear", confirmYes: "Delete", cancel: "Cancel", save: "Save", titleEmpty: "Title required",
      uploaded: (n) => `Uploaded ${n} page(s) — the tower grew ${n} floor(s)`, someFailed: (n) => `${n} file(s) failed — see the list above`,
      wrongType: "Not an .html / .htm file — skipped", tooBig: "Larger than 5 MB — skipped", emptyFile: "Empty file — skipped", remove: "Remove",
      count: (b, m) => `${b + m} floors: ${b} built-in + ${m} uploaded`, waiting: "queued", net: "Network error, please retry", pwEmpty: "Enter the password",
      checking: "Logging in…", deleted: (t) => `Deleted “${t}”`, renamed: "Renamed", sessionGone: "Session expired — please log in again", newTitle: "New title", langBtn: "中文", langLabel: "切换到中文" },
  };
  // Chinese is the default; English only when explicitly chosen.
  let lang = localStorage.getItem("tower-admin-lang") === "en" ? "en" : "zh";
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const zh = {};
  document.querySelectorAll("[data-i18n]").forEach((n) => { zh[n.dataset.i18n] = n.textContent; });
  const t = (k, ...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };
  const errText = (data) => (lang === "en" ? data?.errorEn : data?.error) || t("net");
  const fmtSize = (b) => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(2)} MB`;
  const fmtTime = (s) => { const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(lang === "zh" ? "zh-CN" : "en-GB", { hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  function banner(id, text, kind = "") { const n = $(id); n.textContent = text || ""; n.className = `banner ${text ? kind : ""}`; }

  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((n) => { const k = n.dataset.i18n; n.textContent = lang === "en" ? (EN[k] ?? zh[k]) : zh[k]; });
    document.title = lang === "zh" ? "技术手稿馆 · 楼层后台" : "Archive Tower · Floor Admin";
    const b = $("lang"); b.textContent = t("langBtn"); b.setAttribute("aria-label", t("langLabel")); b.lang = lang === "zh" ? "en" : "zh-CN";
    renderQueue(); if (pages) render();
  }
  $("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorage.setItem("tower-admin-lang", lang); applyLang(); };

  let pages = null, builtin = [];
  async function api(path, opts = {}) {
    let res; try { res = await fetch(API + path, { credentials: "same-origin", ...opts }); } catch { return { ok: false, status: 0, data: null }; }
    let data = null; try { data = await res.json(); } catch {}
    if (res.status === 401 && path !== "/login" && path !== "/session") showLogin(t("sessionGone"));
    return { ok: res.ok, status: res.status, data };
  }
  function showLogin(msg = "") {
    $("loginCard").hidden = false; $("app").hidden = true; $("logout").hidden = true;
    setFieldErr(msg); $("pw").focus();
  }
  async function showApp() { $("loginCard").hidden = true; $("app").hidden = false; $("logout").hidden = false; await refresh(); }
  async function refresh() {
    const r = await api("/pages");
    if (r.ok) { pages = r.data.pages; builtin = r.data.builtin || []; render(); }
    else if (r.status !== 401) banner("listMsg", errText(r.data), "err");
  }

  // ---- floor list (inline rename / inline delete confirm / inline row errors)
  const editing = { id: null, deleting: null };
  function render() {
    const list = $("rows"); list.textContent = "";
    const c = t("count", builtin.length, pages.length); $("count").textContent = lang === "zh" ? `（${c}）` : `(${c})`;
    builtin.forEach((p) => list.append(floorRow(p, true)));
    pages.forEach((p) => list.append(floorRow(p, false)));
    if (!pages.length) list.append(el("li", { className: "empty", textContent: t("empty") }));
  }
  function floorRow(p, isBuiltin) {
    const code = isBuiltin ? p.code : `${p.floor + BUILTIN_FLOORS}F`;
    const li = el("li", { className: `floor${isBuiltin ? " builtin" : ""}` });
    const err = el("p", { className: "row-err", role: "alert" });
    const titleBox = el("div", { className: "title" });
    if (!isBuiltin && editing.id === p.id) {
      const input = el("input", { type: "text", maxLength: 80, value: p.title, required: true });
      input.setAttribute("aria-label", `${code} ${t("newTitle")}`);
      const form = el("form", { className: "edit", noValidate: true }, input, el("button", { type: "submit", className: "primary", textContent: t("save") }),
        el("button", { type: "button", className: "ghost", textContent: t("cancel"), onclick: () => { editing.id = null; render(); } }));
      form.onsubmit = async (e) => {
        e.preventDefault(); const title = input.value.trim();
        if (!title) { err.textContent = t("titleEmpty"); input.setAttribute("aria-invalid", "true"); input.focus(); return; }
        if (title === p.title) { editing.id = null; render(); return; }
        form.querySelectorAll("button,input").forEach((n) => (n.disabled = true));
        const r = await api(`/pages/${p.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
        if (r.ok) { editing.id = null; banner("listMsg", t("renamed"), "ok"); await refresh(); }
        else { form.querySelectorAll("button,input").forEach((n) => (n.disabled = false)); err.textContent = errText(r.data); input.focus(); }
      };
      input.onkeydown = (e) => { if (e.key === "Escape") { editing.id = null; render(); } };
      titleBox.append(form);
      queueMicrotask(() => { input.focus(); input.select(); });
    } else {
      const strong = el("strong", { textContent: p.title });
      if (isBuiltin) strong.append(el("span", { className: "tag", textContent: t("builtin"), title: t("builtinTip") }));
      titleBox.append(strong, el("div", { className: "file", textContent: p.filename }));
    }
    const actions = el("div", { className: "actions" });
    if (!isBuiltin && editing.deleting === p.id) {
      const yes = el("button", { type: "button", className: "danger solid", textContent: t("confirmYes") });
      yes.onclick = async () => {
        yes.disabled = true;
        const r = await api(`/pages/${p.id}`, { method: "DELETE" });
        if (r.ok) { editing.deleting = null; pages = r.data.pages; render(); banner("listMsg", t("deleted", p.title), "ok"); }
        else { yes.disabled = false; err.textContent = errText(r.data); }
      };
      actions.append(el("span", { className: "confirm", textContent: t("confirmDel") }), yes,
        el("button", { type: "button", className: "ghost", textContent: t("cancel"), onclick: () => { editing.deleting = null; render(); } }));
      queueMicrotask(() => yes.focus());
    } else {
      const pv = el("button", { type: "button", textContent: t("preview"), onclick: () => openPreview(p, code) });
      pv.setAttribute("aria-label", `${t("preview")} ${code} ${p.title}`);
      const op = el("a", { className: "btn", href: p.url, target: "_blank", rel: "noopener noreferrer", textContent: t("open") });
      op.setAttribute("aria-label", `${t("open")} ${code} ${p.title}`);
      actions.append(pv, op);
      if (isBuiltin) actions.append(el("span", { className: "locked", textContent: t("locked"), title: t("builtinTip") }));
      else if (editing.id !== p.id) {
        const rn = el("button", { type: "button", textContent: t("rename"), onclick: () => { editing.id = p.id; editing.deleting = null; banner("listMsg", ""); render(); } });
        rn.setAttribute("aria-label", `${t("rename")} ${code}`);
        const del = el("button", { type: "button", className: "danger", textContent: t("del"), onclick: () => { editing.deleting = p.id; editing.id = null; banner("listMsg", ""); render(); } });
        del.setAttribute("aria-label", `${t("del")} ${code} ${p.title}`);
        actions.append(rn, del);
      }
    }
    li.append(el("span", { className: "code", textContent: code }), titleBox,
      el("span", { className: "meta", textContent: p.size == null ? "—" : fmtSize(p.size) }),
      el("span", { className: "meta time", textContent: p.createdAt ? fmtTime(p.createdAt) : "—" }), actions, err);
    return li;
  }
  function openPreview(p, code) { $("previewTitle").textContent = `${code} · ${p.title}`; $("previewFrame").src = p.url; $("previewOpen").href = p.url; $("preview").showModal(); }
  $("previewClose").onclick = () => $("preview").close();
  $("preview").addEventListener("close", () => { $("previewFrame").src = "about:blank"; });

  // ---- login (inline error under the field)
  function setFieldErr(msg) { $("pwErr").textContent = msg || ""; $("pw").setAttribute("aria-invalid", msg ? "true" : "false"); }
  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!$("pw").value) { setFieldErr(t("pwEmpty")); $("pw").focus(); return; }
    const btn = $("loginBtn"); btn.disabled = true; btn.textContent = t("checking"); setFieldErr("");
    const r = await api("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("pw").value }) });
    $("pw").value = ""; btn.disabled = false; btn.textContent = lang === "en" ? EN.login : zh.login;
    if (r.ok) showApp(); else { setFieldErr(errText(r.data)); $("pw").focus(); }
  };
  $("logout").onclick = async () => { await api("/logout", { method: "POST" }); pages = null; banner("uploadMsg", ""); banner("listMsg", ""); showLogin(); };

  // ---- upload queue: drag & drop, per-file progress and inline errors
  let queue = []; let busy = false;
  const drop = $("drop"), input = $("file");
  drop.onclick = () => input.click();
  input.onchange = () => { add([...input.files]); input.value = ""; };
  let depth = 0;
  drop.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; drop.classList.add("over"); });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  drop.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; drop.classList.remove("over"); } });
  drop.addEventListener("drop", (e) => { e.preventDefault(); depth = 0; drop.classList.remove("over"); add([...e.dataTransfer.files]); });
  // Dropping outside the zone must not navigate away from the admin.
  ["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => { if (!drop.contains(e.target)) e.preventDefault(); }));

  function add(files) {
    if (busy) return;
    queue = queue.filter((q) => q.state === "queued");
    for (const f of files) {
      let err = "";
      if (!/\.html?$/i.test(f.name)) err = "wrongType"; else if (f.size > MAX) err = "tooBig"; else if (!f.size) err = "emptyFile";
      queue.push({ file: f, state: err ? "rejected" : "queued", pct: 0, errKey: err, errMsg: "" });
    }
    banner("uploadMsg", ""); renderQueue();
  }
  function ready() { return queue.filter((q) => q.state === "queued"); }
  function renderQueue() {
    const ul = $("queue"); ul.textContent = "";
    queue.forEach((q, i) => {
      const cls = q.state === "done" ? " is-done" : q.state === "error" ? " is-error" : q.state === "rejected" ? " is-error is-rejected" : "";
      const pct = q.state === "rejected" ? "—" : q.state === "queued" ? t("waiting") : `${q.pct}%`;
      const bar = el("div", { className: "bar" }, el("i", { style: `width:${q.pct}%` }));
      bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-valuemin", "0"); bar.setAttribute("aria-valuemax", "100"); bar.setAttribute("aria-valuenow", String(q.pct));
      bar.setAttribute("aria-label", q.file.name);
      const rm = el("button", { type: "button", className: "ghost", textContent: t("remove"), disabled: busy, onclick: () => { queue.splice(i, 1); renderQueue(); } });
      rm.setAttribute("aria-label", `${t("remove")} ${q.file.name}`);
      if (q.state === "uploading" || q.state === "done") rm.hidden = true;
      ul.append(el("li", { className: `qitem${cls}` },
        el("span", { className: "name", title: q.file.name }, q.file.name, el("small", { textContent: fmtSize(q.file.size) })),
        bar, el("span", { className: "pct", textContent: pct }), rm,
        el("p", { className: "err", textContent: q.errKey ? t(q.errKey) : q.errMsg })));
    });
    const n = ready().length;
    $("uploadBtn").disabled = busy || !n;
    $("titleInput").disabled = busy || n > 1;
  }
  function uploadOne(q, title) {
    return new Promise((resolve) => {
      const form = new FormData(); form.append("file", q.file); if (title) form.append("title", title);
      const xhr = new XMLHttpRequest(); xhr.open("POST", API + "/pages"); xhr.withCredentials = true;
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) { q.pct = Math.min(99, Math.round((e.loaded / e.total) * 100)); renderQueue(); } };
      xhr.onload = () => { let data = null; try { data = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 401) showLogin(t("sessionGone"));
        resolve({ ok: xhr.status >= 200 && xhr.status < 300, data }); };
      xhr.onerror = () => resolve({ ok: false, data: null });
      xhr.send(form);
    });
  }
  $("uploadBtn").onclick = async () => {
    const todo = ready(); if (!todo.length) return;
    busy = true; const title = todo.length === 1 ? $("titleInput").value.trim() : "";
    let ok = 0, bad = 0;
    for (const q of todo) {
      q.state = "uploading"; q.pct = 0; renderQueue();
      const r = await uploadOne(q, title);
      if (r.ok) { ok++; q.state = "done"; q.pct = 100; } else { bad++; q.state = "error"; q.errMsg = errText(r.data); }
      renderQueue();
    }
    busy = false; $("titleInput").value = ""; renderQueue();
    banner("uploadMsg", [ok ? t("uploaded", ok) : "", bad ? t("someFailed", bad) : ""].filter(Boolean).join("；"), bad ? "err" : "ok");
    if (ok) refresh();
  };

  applyLang();
  api("/session").then((r) => (r.data?.authenticated ? showApp() : showLogin()));
})();
</script>
</body>
</html>
